<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Stickers WPP</title>
    <script>
      (function(){try{var t=JSON.parse(localStorage.getItem('stickers-theme')||'{}');if(t.state&&t.state.isDark){document.documentElement.classList.add('dark');}}catch(e){document.documentElement.classList.add('dark');}})();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
